<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibi Banana Peeler</title>
    <link rel="stylesheet" href="style.css?v=chibi">
</head>
<body>

    <div class="game-container">
        <div id="level-display">Level 1/20</div>
        <div id="peel-counter">Peels Remaining: 3</div>
        
        <div class="banana-box">
            <div class="banana-core">
                <div class="fruit-body">
                    <div class="face">
                        <div class="eye left-eye"><div class="shine"></div></div>
                        <div class="eye right-eye"><div class="shine"></div></div>
                        <div class="mouth"></div>
                        <div class="blush left-blush"></div>
                        <div class="blush right-blush"></div>
                    </div>
                </div>
                <div class="fruit-tip"></div>
            </div>
            
            <div id="peel-spawn-layer"></div>
        </div>

        <button id="next-btn" onclick="goToNextLevel()">Next Level</button>
        <div id="win-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
